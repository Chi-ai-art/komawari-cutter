# Netlify の設定（ビルド不要の静的サイト）
[build]
  publish = "."

# Service Worker は常に最新を取りに行かせる（古いキャッシュに閉じ込められないように）
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
